services:
  empress:
    build: .
    image: empress-dynasty:latest
    container_name: empress-dynasty
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TZ: Asia/Shanghai
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
